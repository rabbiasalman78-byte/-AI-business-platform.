<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEXORA BUSINESS: Your workspace</title>
<style>
:root{--bg:#130c1f;--sf:#241638;--sf2:#2f1d49;--pr:#8b6bb8;--lv:#cdbbf0;--rg:#c9a28f;--tx:#f3ecdf;--mt:#a99bc0;--ln:#3d2a5c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Iowan Old Style",Georgia,serif;font-weight:600;margin:0}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--lv);outline-offset:2px}
#app{display:grid;grid-template-columns:260px 1fr 340px;height:100%}
aside,main{min-height:0;overflow:auto}
#nav{background:var(--sf);border-right:1px solid var(--ln);padding:16px 12px}
#ai{background:linear-gradient(180deg,#2a1845,#1b1030);border-left:1px solid var(--rg);display:flex;flex-direction:column;overflow:hidden}
.brand{font-family:Georgia,serif;font-size:18px;letter-spacing:.04em;padding:4px 8px 12px}
input,select,textarea{padding:8px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg)}
#q{width:100%;margin-bottom:10px}
.grp>button{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:8px;color:var(--rg);font-weight:600;text-align:left}
.grp ul{list-style:none;margin:0 0 6px;padding:0}.grp.closed ul{display:none}
.it{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 10px}
.it:hover{background:var(--sf2)}.it.on{background:var(--pr);color:#fff}
main{padding:28px 32px}
.tag{display:inline-block;border:1px solid var(--rg);color:var(--rg);border-radius:99px;padding:1px 10px;font-size:12px;margin-bottom:10px}
.tag.ok{border-color:var(--lv);color:var(--lv)}
.lead{color:var(--mt);max-width:62ch}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px 18px;margin-top:18px;max-width:72ch}
.box h3{font-size:16px;margin-bottom:8px;color:var(--lv)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.grid .box{margin:0}.grid p{margin:4px 0;color:var(--mt);font-size:13.5px}
.btn{border:1px solid var(--pr);background:none;border-radius:99px;padding:6px 14px}.btn:hover,.btn.on{background:var(--pr);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed;background:none}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
label{display:block;color:var(--mt);font-size:13px;margin-top:10px}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:var(--rg)}
.task{display:flex;gap:8px;align-items:center;padding:3px 0}.task.d span{text-decoration:line-through;color:var(--mt)}
.lock{opacity:.6}.pre{white-space:pre-wrap;font:inherit;margin:8px 0}.box{transition:border-color .15s}.box:hover{border-color:var(--pr)}h1{font-size:28px;margin-bottom:6px}
dl{margin:0;display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center}dt{color:var(--mt)}dd{margin:0}
.aih{padding:14px 16px;border-bottom:1px solid var(--ln)}.aih b{font-family:Georgia,serif;color:var(--lv)}.aih small{display:block;color:var(--mt)}
#log{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.m{max-width:92%;padding:9px 12px;border-radius:12px;background:var(--sf2);white-space:pre-wrap}.m.u{align-self:flex-end;background:var(--pr);color:#fff}
#opts{padding:10px 16px 14px;display:flex;flex-wrap:wrap;gap:8px;border-top:1px solid var(--ln)}
.tg{display:none;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--pr);border:0;border-radius:99px;padding:10px 16px;color:#fff}
@media(max-width:900px){#app{grid-template-columns:1fr}
#nav,#ai{position:fixed;top:0;bottom:0;z-index:6;width:min(86vw,340px);padding-top:calc(16px + env(safe-area-inset-top,0px))}
#nav{left:0;transform:translateX(-100%)}#ai{right:0;transform:translateX(100%)}#nav.open,#ai.open{transform:none}
.tg{display:block}#tn{left:14px}#ta{right:14px}main{padding:20px 18px 80px}}
@media(prefers-reduced-motion:no-preference){#nav,#ai{transition:transform .2s}}
</style><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#241638"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="NEXORA"></head>
<body><div id="app">
<aside id="nav" aria-label="Workspace navigation"><div class="brand">NEXORA BUSINESS</div>
<input id="q" type="search" placeholder="Search sections" aria-label="Search sections"><div id="menu"></div></aside>
<main id="main" tabindex="-1"></main>
<aside id="ai" aria-label="Business AI"><div class="aih"><b>Business AI</b><small id="ctx"></small><small>Your AI business manager.</small></div>
<div id="log" aria-live="polite"></div><div id="opts"></div><div class="row" style="padding:0 16px 14px;flex-wrap:nowrap;margin:0"><input id="ci" placeholder="Ask your Business AI" aria-label="Ask your Business AI" style="flex:1;min-width:0"><button class="btn" id="cs">Send</button></div></aside></div>
<button class="tg" id="tn">Menu</button><button class="tg" id="ta">Business AI</button>
<script>
const G={Main:["Workspace Overview","AI Employees","Discover Opportunities","My Businesses","My Projects"],
Creation:["Digital Product Studio","Branding and Design Studio","Content Studio","Marketing Studio","Website and App Builder","Document Studio","Physical Product Development"],
Management:["Research Center","Finance Center","Tasks and Approvals","Calendar and Planning","Automation Center","Integrations"],
Organization:["My Library","Project Memory","Conversations and History","Prompt Sharing and Handover","Universal Search","Templates","Export Center"],
Account:["Plans and Subscription","Token Wallet","Usage History","Notifications","Settings"]};
const D={"Discover Opportunities":"The discovery engine will find underrated niches and underserved audiences, with evidence and stated uncertainty. It needs a connected AI model and research sources.","Research Center":"Market, competitor and audience research. Evidence is kept separate from assumptions.","Finance Center":"Budgets, pricing and profit estimates, never presented as guaranteed results.","My Library":"Saved work you can reuse and continue later.","Branding and Design Studio":"Brand names, palettes, voice and visual direction.","Content Studio":"Calendars, captions, scripts and platform plans.","Marketing Studio":"Strategy, SEO, funnels and campaigns.","Website and App Builder":"Planning and guidance from idea to launch.","Document Studio":"Business documents and templates.","Physical Product Development":"Ideas, sourcing research, packaging and costing.","Plans and Subscription":"Free, paid and VIP plans. Payments are not built yet.","Token Wallet":"Tokens and payments need accounts and a payment provider, which a single page cannot provide.","Automation Center":"Scheduled workflows need a backend that runs while you are away.","Integrations":"Connecting storefronts and other tools needs a backend and each platform's approval."};
const E=[["Research AI","Market, competitor and audience research, trends, opportunity validation. Separates evidence from assumptions."],["Business Strategy AI","Business plans and models, growth strategy, execution roadmaps, risk analysis, based on your resources."],["Branding AI","Names, positioning, identity, palettes, guidelines, voice."],["Marketing AI","SEO, ad plans, funnels, customer acquisition, campaigns."],["Content and Social Media AI","Calendars, captions, scripts, platform planning."],["Digital AI","Discovers niches and creates, packages and prepares digital products for sale."],["Physical Product Development AI","Product ideas, sourcing, packaging, positioning, costing."],["Website and App Builder AI","Website and app planning, architecture, testing, launch help."],["Image and Design AI","Visuals, mockups, social designs, design direction."],["Video AI","Concepts, scripts, storyboards, short and long-form planning."],["Finance AI","Budgets, pricing, projections. Estimates are never guarantees."],["Prompt Engineer AI","Creates and improves prompts and repeatable workflows."],["Learning and Skills AI","Teaches skills, roadmaps, exercises, practical guidance."]];
const DP={"Research Center":["Research AI",["Market research report","Competitor analysis","Audience profile","Trend summary"]],"Branding and Design Studio":["Branding AI",["Brand name ideas","Brand positioning","Color palette and visual direction","Brand voice guide"]],"Content Studio":["Content and Social Media AI",["30-day content calendar","Captions","Video script","Content ideas"]],"Marketing Studio":["Marketing AI",["Marketing strategy","SEO plan","Sales funnel","Ad campaign plan"]],"Website and App Builder":["Website and App Builder AI",["Website plan","App concept","Launch checklist","Technical architecture"]],"Document Studio":["Business Strategy AI",["Business plan","Proposal","Policy document","Meeting notes"]],"Physical Product Development":["Physical Product Development AI",["Product ideas","Sourcing research plan","Packaging concept","Cost breakdown"]],"Finance Center":["Finance AI",["Budget plan","Pricing strategy","Profit estimate","Expense plan"]],"Prompt Sharing and Handover":["Prompt Engineer AI",["Improve my prompt","Create a prompt","Handover summary"]],"My Businesses":["Business Strategy AI",["Business model","Growth strategy","Risk analysis","Execution roadmap"]]};
const LV=n=>n==="Digital AI"||Object.values(DP).some(c=>c[0]===n);
const Q=[["role","Which describes you best?",["Student","Freelancer","Creator","Entrepreneur","Business owner"]],
["level","How experienced are you?",["Beginner","Some experience","Experienced"]],
["goal","What do you want to do first?",["Start a business","Create digital products","Manage existing work","Learn a skill","Explore opportunities"]],
["budget","What budget do you have?",["Almost none","Small","Flexible"],p=>["Start a business","Create digital products","Explore opportunities"].includes(p.goal)],
["time","How much time can you give each week?",["Under 5 hours","5 to 15 hours","15+ hours"],p=>p.goal!=="Learn a skill"],
["help","Where do you need the most help?",["Finding ideas","Making the product","Marketing","Managing work","Understanding tools"]]];
const REC={"Start a business":[["Discover Opportunities","Research Center","Finance Center"],["Research AI","Business Strategy AI","Finance AI"]],"Create digital products":[["Digital Product Studio","Branding and Design Studio"],["Digital AI","Image and Design AI"]],"Manage existing work":[["My Projects","Tasks and Approvals"],["Business Strategy AI"]],"Learn a skill":[["My Projects"],["Learning and Skills AI"]],"Explore opportunities":[["Discover Opportunities","Research Center"],["Research AI"]]};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let P=ld("nx_p",{}),PR=ld("nx_pr",[]),BR=ld("nx_br",{}),cur="Workspace Overview",LB=ld("nx_lb",[]),UL=ld("nx_ul",[]),DS={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function go(n){cur=n;menu($("#q").value);view();$("#nav").classList.remove("open")}
function menu(f=""){const m=$("#menu");m.innerHTML="";for(const g in G){const items=G[g].filter(n=>n.toLowerCase().includes(f.toLowerCase()));if(!items.length)continue;
const d=document.createElement("div");d.className="grp";d.innerHTML=`<button aria-expanded="true">${g}<span>▾</span></button><ul></ul>`;
d.firstChild.onclick=()=>{d.classList.toggle("closed");d.firstChild.setAttribute("aria-expanded",!d.classList.contains("closed"))};
items.forEach(n=>{const li=document.createElement("li"),b=document.createElement("button");b.className="it"+(n===cur?" on":"");b.textContent=n;b.onclick=()=>go(n);li.append(b);d.lastChild.append(li)});m.append(d)}}
const built=["Workspace Overview","AI Employees","My Projects","Tasks and Approvals","Project Memory","Digital Product Studio","Discover Opportunities","Settings","My Library","Export Center","Universal Search","Conversations and History","Calendar and Planning","Notifications","Usage History","Templates","Founder Dashboard",...Object.keys(DP)];
function recText(){const r=REC[P.goal];if(!r)return"";let t=`Start with: ${r[0].join(", ")}.\nSuggested AI employees: ${r[1].join(", ")}.`;if(P.budget==="Almost none")t+="\nBecause your budget is almost none, favor low-cost options first.";if(P.level==="Beginner")t+="\nI'll keep explanations simple.";return t}
function view(){$("#ctx").textContent="Viewing: "+cur;const m=$("#main");
let h=`<span class="tag ${built.includes(cur)?"ok":""}">${built.includes(cur)?"Working":"Planned, not built yet"}</span><h1>${cur}</h1>`;
if(cur==="Workspace Overview"){h+=`<p class="lead">Your digital headquarters.</p>`;const r=REC[P.goal];h+=`<div class="grid">${[["Projects",PR.length],["Open tasks",PR.reduce((a,p)=>a+p.tasks.filter(t=>!t.d).length,0)],["Saved work",LB.length],["AI requests",UL.length]].map(s=>`<div class="box"><p>${s[0]}</p><h2>${s[1]}</h2></div>`).join("")}</div><div class="box"><h3>Quick actions</h3><div class="row">${["Digital Product Studio","Discover Opportunities","Research Center","Marketing Studio","My Projects"].map(s=>`<button class="btn" data-go="${s}">${s}</button>`).join("")}</div></div>`;
h+=`<div class="box"><h3>Recommended for you</h3>${r?`<p>${esc(recText()).replace(/\n/g,"<br>")}</p><div class="row">${r[0].map(s=>`<button class="btn" data-go="${s}">${s}</button>`).join("")}</div>`:"<p class='lead'>Answer the Business AI's questions on the right to get recommendations.</p>"}</div>
<div class="box"><h3>Progress</h3><p>${PR.length} project(s), ${PR.reduce((a,p)=>a+p.tasks.filter(t=>t.d).length,0)} of ${PR.reduce((a,p)=>a+p.tasks.length,0)} tasks done.</p></div>`}
else if(cur==="AI Employees"){h+=`<p class="lead">Each specialist will have its own instructions, tools and limits, all coordinated by the Business AI. Specialists marked Live work in their own sections. The others are not connected yet.</p><div class="grid">${E.map(e=>`<div class="box"><h3>${e[0]}</h3><p>${e[1]}</p><span class="tag ${LV(e[0])?"ok":""}">${LV(e[0])?"Live":"Not connected"}</span></div>`).join("")}</div>`}
else if(cur==="My Projects"){h+=`<p class="lead">Create projects and break them into tasks. Saved in this browser.</p><div class="row"><input id="pn" placeholder="New project name"><button class="btn" id="pa">Add project</button></div>`+(PR.length?PR.map(p=>{const dn=p.tasks.filter(t=>t.d).length,pc=p.tasks.length?Math.round(dn/p.tasks.length*100):0;return`<div class="box"><h3>${esc(p.name)}</h3><div class="bar"><i style="width:${pc}%"></i></div><small>${dn}/${p.tasks.length} done</small>${p.tasks.map(t=>`<label class="task ${t.d?"d":""}" style="margin:0"><input type="checkbox" data-t="${p.id}|${t.id}" ${t.d?"checked":""}><span>${esc(t.t)}</span></label>`).join("")}<div class="row"><input data-ti="${p.id}" placeholder="Add a task"><input type="date" data-td="${p.id}" aria-label="Due date"><button class="btn" data-ta="${p.id}">Add</button><button class="btn" data-pd="${p.id}">Delete project</button></div></div>`}).join(""):`<div class="box"><p class="lead">No projects yet. Add your first one above.</p></div>`)}
else if(cur==="Tasks and Approvals"){const all=PR.flatMap(p=>p.tasks.filter(t=>!t.d).map(t=>[p.name,t.t]));h+=`<p class="lead">Open tasks from every project. Approvals will appear here once publishing and paid actions exist.</p><div class="box"><h3>Open tasks</h3>${all.length?all.map(a=>`<div class="task"><span>${esc(a[1])} <small style="color:var(--mt)">(${esc(a[0])})</small></span></div>`).join(""):"<p class='lead'>Nothing open.</p>"}</div>`}
else if(cur==="Project Memory"){const k=Q.filter(q=>P[q[0]]);h+=`<p class="lead">What the Business AI has saved about you, in this browser only. Change or remove anything.</p><div class="box">${k.length?`<dl>${k.map(q=>`<dt>${q[1]}</dt><dd>${esc(P[q[0]])}</dd><dd><button class="btn" data-fg="${q[0]}">Forget</button></dd>`).join("")}</dl>`:"<p class='lead'>Nothing saved.</p>"}</div>`}
else if(cur==="Digital Product Studio"){const T=["Ebook","Workbook","Journal","Planner","Template","Checklist","Tracker","Toolkit"];
h+=`<p class="lead">The 7-step flow from your blueprint. Steps 1 to 3 save your product brief. Step 4 writes the product with AI.</p>
<div class="box"><h3>Step 1: Select a niche</h3><small class="lead">Niche discovery isn't built yet, so type your own.</small><input id="bn" value="${esc(BR.niche||"")}" placeholder="e.g. a specific audience and problem" style="width:100%;margin-top:6px"></div>
<div class="box"><h3>Step 2: Select a product</h3><div class="row">${T.map(t=>`<button class="btn ${BR.type===t?"on":""}" data-ty="${t}">${t}</button>`).join("")}</div></div>
<div class="box"><h3>Step 3: Format and requirements</h3><small class="lead">Defaults are filled in.</small><label>Style</label><select id="bs">${["Clear and practical","Friendly","Professional"].map(o=>`<option ${(BR.style||"Clear and practical")===o?"selected":""}>${o}</option>`).join("")}</select><label>Length</label><select id="bl">${["Short","Medium","Long"].map(o=>`<option ${(BR.len||"Medium")===o?"selected":""}>${o}</option>`).join("")}</select><label>Audience</label><input id="ba" value="${esc(BR.aud||"")}" placeholder="Who is it for?" style="width:100%"></div>
<div class="box"><h3>Step 4: Create</h3><div class="row"><button class="btn" id="mk">Create</button><small class="lead">Needs a niche and a product type.</small></div><div id="out">${BR.out?"<pre style='white-space:pre-wrap;font:inherit'>"+esc(BR.out)+"</pre><button class='btn' id='dl'>Download .md</button>":""}</div></div>
<div class="box lock"><h3>Steps 5 to 7</h3><p>5. Create packaging: cover, mockups, previews.<br>6. Final product, exportable.<br>7. Website-ready presentation: product page, copy, pricing suggestions, publish after your approval.</p></div>`}
else if(cur==="Discover Opportunities"){h+=`<p class="lead">Claude suggests niches that fit your profile. These are AI ideas to investigate, not verified market research. Nothing here is guaranteed profitable or competition-free.</p><div class="row"><input id="dq" placeholder="Optional: an interest or audience" value="${esc(BR.dq||"")}"><button class="btn" id="dn">Suggest niches</button></div><div id="nl" class="grid">${(BR.niches||[]).map((n,i)=>nc(n,i)).join("")}</div>`}else if(DP[cur]){const d=DS[cur]=DS[cur]||{t:0,i:"",out:""},c=DP[cur];h+=`<p class="lead">${c[0]} works for you here. Pick a task, describe what you need, and click Generate.</p><div class="box"><div class="row">${c[1].map((t,i)=>`<button class="btn ${d.t===i?"on":""}" data-dt="${i}">${t}</button>`).join("")}</div><label>Details: goal, audience, budget, anything relevant</label><textarea id="di" rows="4" style="width:100%">${esc(d.i)}</textarea><div class="row"><button class="btn" id="dg">Generate</button></div><div id="do">${d.out?`<pre class="pre">${esc(d.out)}</pre><div class="row"><button class="btn" id="ds">Save to Library</button><button class="btn" id="dd">Download</button></div>`:""}</div></div>`}
else if(cur==="My Library"){h+=`<p class="lead">Everything you saved from the departments.</p>`+(LB.length?LB.map(l=>`<div class="box"><h3>${esc(l.title)}</h3><small>${l.date}</small><pre class="pre" style="max-height:200px;overflow:auto">${esc(l.text)}</pre><div class="row"><button class="btn" data-ld="${l.id}">Download</button><button class="btn" data-lx="${l.id}">Delete</button></div></div>`).join(""):`<div class="box"><p class="lead">Nothing saved yet. Generate something in a department and click Save to Library.</p></div>`)}
else if(cur==="Export Center"){h+=`<div class="box"><h3>Export</h3><div class="row"><button class="btn" id="e1">Library (.md)</button><button class="btn" id="e2">Projects and tasks (.json)</button></div></div>`}
else if(cur==="Universal Search"){h+=`<div class="box"><input id="us" placeholder="Search library, projects, tasks, memory, chats" style="width:100%"><div id="sr"></div></div>`}
else if(cur==="Conversations and History"){h+=`<div class="box">${H.length?H.map(x=>`<p>${esc(x)}</p>`).join(""):"<p class='lead'>No conversations yet.</p>"}<div class="row"><button class="btn" id="hc">Clear history</button></div></div>`}
else if(cur==="Calendar and Planning"){const t=PR.flatMap(p=>p.tasks.filter(t=>t.due&&!t.d).map(t=>({...t,p:p.name}))).sort((a,b)=>a.due>b.due?1:-1);h+=`<p class="lead">Open tasks that have a due date. Set dates in My Projects.</p><div class="box">${t.length?t.map(x=>`<div class="task"><b>${x.due}</b>&nbsp;${esc(x.t)} <small style="color:var(--mt)">(${esc(x.p)})</small></div>`).join(""):"<p class='lead'>No dated tasks.</p>"}</div>`}
else if(cur==="Notifications"){const td=new Date().toISOString().slice(0,10),o=PR.flatMap(p=>p.tasks.filter(t=>t.due&&!t.d&&t.due<td).map(t=>t.t+" ("+p.name+")"));h+=`<div class="box">${o.length?o.map(x=>`<p>Overdue: ${esc(x)}</p>`).join(""):"<p class='lead'>No notifications.</p>"}</div>`}
else if(cur==="Usage History"){const c={};UL.forEach(u=>{const k=u.d+" | "+u.s;c[k]=(c[k]||0)+1});h+=`<p class="lead">AI requests made from this browser.</p><div class="box">${Object.keys(c).length?Object.entries(c).reverse().map(([k,v])=>`<p>${esc(k)}: ${v}</p>`).join(""):"<p class='lead'>No AI requests yet.</p>"}</div>`}
else if(cur==="Templates"){h+=`<p class="lead">Start a department task with one click.</p>`+Object.entries(DP).map(([s,c])=>`<div class="box"><h3>${s}</h3><div class="row">${c[1].map((t,i)=>`<button class="btn" data-tp="${s}|${i}">${t}</button>`).join("")}</div></div>`).join("")}
else if(cur==="Founder Dashboard"){const st=[["Projects",PR.length],["Tasks",PR.reduce((a,p)=>a+p.tasks.length,0)],["Library items",LB.length],["AI requests",UL.length],["Saved answers",Object.keys(P).length]];h+=`<p class="lead">Numbers for this browser only. A dashboard across all customers needs a shared database and accounts, which this page cannot provide.</p><p><a class="btn" href="costs.html" style="display:inline-block;text-decoration:none">Open AI cost chart in PKR</a></p><div class="grid">${st.map(s=>`<div class="box"><p>${s[0]}</p><h2>${s[1]}</h2></div>`).join("")}</div>`}
else if(cur==="Settings"){h+=`<div class="box"><h3>Your data</h3><p class="lead">Everything here is stored only in this browser.</p><button class="btn" id="ca">Delete all my data</button></div>`}
else h+=`<p class="lead">${D[cur]||"This section is in the blueprint and will be designed after customer research."}</p>`;
m.innerHTML=h;bind()}
function bind(){const m=$("#main");
m.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
let x=$("#pa");if(x)x.onclick=()=>{const n=$("#pn").value.trim();if(!n)return;PR.push({id:uid(),name:n,tasks:[]});sv("nx_pr",PR);view()};
m.querySelectorAll("[data-ta]").forEach(b=>b.onclick=()=>{const i=m.querySelector(`[data-ti="${b.dataset.ta}"]`),t=i.value.trim();if(!t)return;PR.find(p=>p.id===b.dataset.ta).tasks.push({id:uid(),t,d:0,due:(m.querySelector(`[data-td="${b.dataset.ta}"]`)||{}).value||""});sv("nx_pr",PR);view()});
